name: Rebuild profile assets

on:
  schedule:
    - cron: "23 2 * * *" # daily at 02:23 UTC (10:23 MYT)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.toml
      - scripts/**
      - .github/workflows/build.yml

permissions:
  contents: write

concurrency:
  group: rebuild-profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Build cards, moon and night sky
        run: |
          pip install -r scripts/requirements.txt
          python scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit refreshed assets
        run: |
          git add -A assets data
          if git diff --cached --quiet; then
            echo "Assets already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile assets"
          git push
