# Content for the profile README assets. Edit this file, then run
#   python scripts/build.py
# (or push: the GitHub Action rebuilds assets/*.svg automatically).
#
# Deliberately GitHub-centric: handle, interests, repositories and activity.
# No name, institution, awards or contact details.

[identity]
name = "ArcueidMP"
eyebrow = "SOFTWARE ENGINEERING · RESEARCH PORTFOLIO"
tagline = ["Undergraduate exploring AI agents,", "world models, and embodied intelligence"]

# The card on the right of the hero. Its numbers are filled from the GitHub API.
[dossier]
eyebrow = "PUBLIC ACTIVITY"
title = "GitHub at a glance"
detail = "public data · refreshed daily"

[links]
github = "ArcueidMP"

# ---------------------------------------------------------------------------
# 01 / RESEARCH
[research]
interests = ["AI Agents", "World Models", "Embodied Intelligence"]
related = ["Large Language Models", "Computer Vision"]

# ---------------------------------------------------------------------------
# 02 / SELECTED WORK
# Stars, primary language and last push date come from the GitHub API.
[[projects]]
repo = "ArcueidMP/DisposableResume"
title = "DisposableResume"
description = "A zero-retention, browser-only résumé builder with live preview and client-side PDF export."
