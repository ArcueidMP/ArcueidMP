# Content for the profile README assets. Edit this file, then run
#   python scripts/build.py
# (or push: the GitHub Action rebuilds assets/*.svg automatically).
#
# Deliberately GitHub-centric: handle, interests, repositories and activity.
# No name, institution, awards or contact details.

[identity]
name = "ArcueidMP"
eyebrow = "SOFTWARE ENGINEERING · RESEARCH PORTFOLIO"
tagline = ["Undergraduate exploring AI agents,", "world models & embodied AI, and AI infra"]
# The vermilion seal beside the handle and the line under the tagline, set in
# Shippori Mincho. After changing the Japanese text, run
#   python scripts/prepare_fonts.py ShipporiMincho
# so the font subset covers the new characters.
seal = "月"
epigraph_ja = "月の欠片"
epigraph_en = "— a piece of the moon, kept on GitHub"

# The card on the right of the hero. Its numbers are filled from the GitHub API.
[dossier]
eyebrow = "PUBLIC ACTIVITY"
title = "GitHub at a glance"
detail = "public data · refreshed daily"

[links]
github = "ArcueidMP"

# ---------------------------------------------------------------------------
# 01 / RESEARCH
[research]
# Each interest is a title, or { title, note } to add a smaller line below it.
interests = [
  { title = "AI Agents", note = "Development & RL" },
  "World Models & Embodied AI",
  "AI Infra",
]
related = ["Large Language Models", "Computer Vision"]

# ---------------------------------------------------------------------------
# 02 / SELECTED WORK
# Stars, primary language and last push date come from the GitHub API.
[[projects]]
repo = "ArcueidMP/DisposableResume"
title = "DisposableResume"
description = "A zero-retention, browser-only résumé builder with live preview and client-side PDF export."
status = "ACTIVE"

[[projects]]
repo = "ArcueidMP/Domain-Specific-Paper-Harness"
title = "Domain-Specific Paper Harness"
description = "Self-hosted research intelligence: arXiv discovery, grounded full-text analysis and a provenance-aware graph."
status = "ACTIVE"

[[projects]]
repo = "ArcueidMP/AutoPet"
title = "AutoPet"
description = "Windows-first desktop pet: one transparent PNG in, an animated Electron pet out, processed locally."
status = "PROTOTYPE"

# ---------------------------------------------------------------------------
# Section labels (number / eyebrow / heading). 03 is the recent-activity
# ledger, 04 the night-sky contribution calendar and 05 the 3D contribution map
# from github-profile-3d-contrib; all three are filled automatically.
[[sections]]
id = "research"
eyebrow = "01 / RESEARCH"
heading = "Current interests"

[[sections]]
id = "work"
eyebrow = "02 / SELECTED WORK"
heading = "Featured projects"

[[sections]]
id = "log"
eyebrow = "03 / LOG"
heading = "Recent public activity"

[[sections]]
id = "activity"
eyebrow = "04 / ACTIVITY"
heading = "A year of contributions"

[[sections]]
id = "relief"
eyebrow = "05 / RELIEF"
heading = "The same year, in three dimensions"
